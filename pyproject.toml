[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunday"
version = "0.1.0"
description = "A local voice assistant that treats the internet as a door it has to unlock"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "ollama>=0.6",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "chromadb>=1.0",
  "websockets>=14.0",
  "anthropic>=0.60",
  "ddgs>=9.0",
  "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]

[project.scripts]
sunday = "sunday.main:main"
sunday-sidecar = "sunday.sidecar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sunday = ["py.typed"]
