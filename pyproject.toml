[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunday"
version = "0.1.0"
description = "A local voice assistant that treats the internet as a door it has to unlock"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "ollama>=0.6",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "chromadb>=1.0",
  "websockets>=14.0",
  "anthropic>=0.60",
  "ddgs>=9.0",
  "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]
# Voice in. onnxruntime and numpy arrive with chromadb already; these are the
# two that do not. Kept out of the base install because a text-only run has no
# use for PortAudio, and PortAudio is the part that fails on a headless box.
voice = [
  "sounddevice>=0.5", "tokenizers>=0.20", "onnxruntime>=1.20", "numpy>=1.26",
  "kokoro-onnx>=0.4", "onnx-asr[hub]>=0.12",
]

[project.scripts]
sunday = "sunday.main:main"
sunday-sidecar = "sunday.sidecar:main"
sunday-models = "sunday.audio.models:main"
sunday-mic = "sunday.audio.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sunday = ["py.typed"]
