# Sunday configuration.
#
# Copy to `config.toml` at the repo root (development) or to
# %LOCALAPPDATA%\Sunday\config.toml (installed). The repo-root copy wins when
# both exist. Set SUNDAY_HOME to move the data directory somewhere else.

[assistant]
# What it calls itself, in the system prompt and in the transcript. The
# package, the process and the data folder stay "sunday" -- those are the
# program; this is the person it plays.
name = "Alexa"

[models]
agent           = "qwen3.5:4b"
ollama_url      = "http://127.0.0.1:11434"
context_tokens  = 23552      # measured: the largest 4b window that stays 100% on the card
thinking_budget = 2048
# The airlock summariser. The only model that is not local, and it only ever
# sees a cleared query plus text that was already public.
summariser      = "deepseek-v4-flash"
# Which transcriber. "moonshine-base" is 61M and ~123 ms a clip; parakeet is
# 600M and ~704 ms, and the stronger model on every published benchmark.
stt             = "parakeet-tdt-0.6b-v2"
# Taken off the top before the memory slices are sized: the system prompt, the
# tool schemas and the memory framing block, then room for the reply itself.
overhead_tokens = 2816
reply_tokens    = 768

[audio]
sample_rate   = 16000
input_device  = ""     # empty = system default
output_device = ""
aec_delay_ms  = 60     # measure once on your hardware
vad_threshold = 0.5
vad_silence_ms = 700
min_clip_ms   = 300    # of speech, not of clip: every clip carries pre-roll
max_clip_ms   = 30000
preroll_ms    = 500    # kept from before the wake word finished
# Open the microphone as soon as the sidecar starts, so the app answers its
# name from a cold start without anybody clicking anything first.
#
# Off in the shipped example on purpose. With it on, speech anywhere in the
# room is a turn: measured within minutes of switching it on, a conversation
# happening nearby was transcribed and run, and a two-step job was cancelled
# by barge-in after both its tools had already changed things on disk. The
# guards all behaved correctly; an open microphone simply means the room is
# talking to it. Turn it on once you know the room.
listen_on_start = false
lead_in_ms    = 4000   # woke, heard nothing, go back to sleep

[wake]
enabled     = true
model       = "alexa"
# Measured, not guessed: a clear "hey jarvis" scores ~0.49 on this mic and
# everything that is not the phrase scores ~0.0002. That was the phrase at the
# time, and the number is a property of the phrase and the voice saying it --
# run `python -m sunday.audio.check` to see both for your own voice and word.
threshold   = 0.3
cooldown_ms = 1500
# After a reply, speech alone opens the next question for this long, so a
# conversation is a conversation rather than a sequence of summonings. 0 = off.
# The cost: for this long after every reply, speech in the room opens a clip
# without the phrase. The clip guards still apply, so the cost is a dropped
# clip rather than a turn.
follow_up_ms = 30000

[tts]
enabled  = true
voice    = "af_heart"   # 54 ship in one file; --voices lists them
speed    = 1.0
language = "en-us"

[echo]
speech_threshold_while_speaking = 0.8
transcript_similarity_cutoff    = 0.6
barge_in_ms                     = 96   # 3 VAD windows; under the 100 ms target
# Still counts as speaking for this long after the last block reaches the
# sound card: there is a buffer to play and then a room still ringing, and
# every defence against hearing itself keys off that flag.
tail_ms                         = 400
# How loud the residual must be, against what was played, to be a person.
# Measure with: python -m sunday.audio.check --echo
barge_in_ratio                  = 0.35

[files]
# Each root can be a bare path, or a table with the name you call it by.
# The name is what lets "move it to the work folder" resolve to a real path
# instead of the model guessing at one.
roots = [
  { label = "documents", path = "C:/Users/User/Documents/Sunday" },
  { label = "work",      path = "E:/Work/Sunday" },
]
max_read_bytes = 200000

[memory]
distance_cutoff = 0.45   # tune with real turns
top_k           = 5
idle_minutes    = 10
# Sized to fit 23552 rather than scaled into it: these four plus the thinking
# reservation come to 19456 of the 19968 left after overhead and the reply, so
# the numbers here are the numbers used. Raise the window and raise these too.
slice_summary   = 2560
slice_recent    = 7680
slice_retrieved = 2560
slice_tools     = 4608

[external]
enabled           = true
search            = "ddgs"
max_hops          = 2
fetch_timeout_s   = 10
fetch_max_bytes   = 2000000
extract_max_chars = 12000
query_max_chars   = 200

[guardrail]
# Reading any of these taints the turn: the web door shuts for the rest of it.
secret_paths = [".env", ".env.*", "*.key", "*.pem", "*.pfx", "*.p12",
                "id_rsa", "id_ed25519", "credentials*", ".ssh/", ".aws/",
                ".gnupg/", "*.kdbx", "google_token.json", "token.json",
                "service-account*.json", "secrets.*", ".npmrc", ".pypirc",
                ".netrc"]
# Prefixes only, each unambiguous enough to carry no false-positive tax.
# Deliberately no entropy scoring and no Luhn checks -- see Stage 05.
key_shapes   = ["sk-", "sk_live_", "ghp_", "gho_", "glpat-", "AKIA", "ASIA",
                "xoxb-", "xoxp-", "xapp-", "AIza", "ya29.", "hf_", "dop_v1_",
                "eyJ", "-----BEGIN"]

[limits]
tool_calls = 12  # hard cap per turn: room for a job, not just a lookup

[ui]
fps_focused     = 60
fps_blurred     = 10
start_minimised = false
autostart       = true
# The backstage trace: one line per step, so you can see what ran rather than
# only what came back. SUNDAY_TRACE=0 overrides this for a single run.
trace           = true
