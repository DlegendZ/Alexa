[package]
name = "sunday"
version = "0.1.0"
description = "A local voice assistant that treats the internet as a door it has to unlock"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
# The bundle is ~10 MB against Electron's ~150, and it stays that way by
# actually asking for it.
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# The title bar is painted by Windows, not by the WebView, so matching it to
# the app's background needs DWM rather than CSS. Windows 11 only; on anything
# older the call fails and the bar stays default, which is why it is ignored
# rather than checked.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }
